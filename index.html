<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 자유새 정기 연주회에 초대합니다.</title>

  <!-- 카카오톡 / SNS 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="2026 자유새 정기 연주회에 초대합니다.">
  <meta property="og:description" content="음악으로 잇는 마음, 함께하는 울림">
  <meta property="og:image" content="https://raw.githubusercontent.com/Monster-GD/music-concert-2026/main/kakao.jpg">
  <meta property="og:url" content="https://monster-gd.github.io/music-concert-2026/">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #121212;
      scroll-behavior: smooth;
      font-family: 'Inter', sans-serif;
    }

    .invitation-card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background-color: #fff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .invitation-img {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
    }

    /* ========================================
       4면
       ======================================== */

    .page-4-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /*
      04.jpg의 위쪽 주소와
      아래쪽 '대중교통' 문구 사이의 빈 공간에
      지도와 버튼을 배치합니다.
    */
    .page-4-content {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      z-index: 10;
    }

    /* 지도 */
    .map-container {
      width: 80%;
      max-width: 340px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      border-radius: 0.6rem;
      overflow: hidden;
      background: #fff;
    }

    .map-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 지도 버튼 영역 */
    .page-4-buttons {
      width: 86%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .map-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 30px;
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.73rem;
      font-weight: 600;
      line-height: 1.2;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }

    .map-button:hover {
      opacity: 0.85;
    }

    .naver-button {
      background: #03c75a;
      color: white;
    }

    .kakao-button {
      background: #fee500;
      color: #191919;
    }

    .google-button {
      background: #ffffff;
      color: #333333;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="invitation-card">

    <!-- 1면 -->
    <img
      src="01.jpg"
      alt="2026 자유새 정기 연주회 초대장 1면"
      class="invitation-img"
    >

    <!-- 2면 -->
    <img
      src="02.jpg"
      alt="2026 자유새 정기 연주회 초대장 2면"
      class="invitation-img"
    >

    <!-- 3면 -->
    <img
      src="03.jpg"
      alt="2026 자유새 정기 연주회 초대장 3면"
      class="invitation-img"
    >

    <!-- 4면 -->
    <div class="page-4-wrapper">

      <!-- 4면 배경 이미지 -->
      <img
        src="04.jpg"
        alt="오시는 길"
        class="invitation-img"
      >

      <!-- 지도 + 지도 버튼 -->
      <div class="page-4-content">

        <!-- 사천문화원 지도 -->
        <div class="map-container">
          <img
            src="map.PNG"
            alt="사천문화원 오시는 길 지도"
          >
        </div>

        <!-- 지도 바로가기 -->
        <div class="page-4-buttons">

          <!-- 네이버 지도 -->
          <a
            href="https://map.naver.com/v5/search/%EA%B2%BD%EB%82%A8%20%EC%82%AC%EC%B2%9C%EC%8B%9C%20%EB%AC%B8%EC%84%A04%EA%B8%B8%2021"
            target="_blank"
            rel="noopener noreferrer"
            class="map-button naver-button"
          >
            네이버 지도
          </a>

          <!-- 카카오맵 -->
          <a
            href="https://map.kakao.com/?q=%EA%B2%BD%EB%82%A8%20%EC%82%AC%EC%B2%9C%EC%8B%9C%20%EB%AC%B8%EC%84%A04%EA%B8%B8%2021"
            target="_blank"
            rel="noopener noreferrer"
            class="map-button kakao-button"
          >
            카카오맵
          </a>

          <!-- 구글 지도 -->
          <a
            href="https://www.google.com/maps/search/?api=1&query=%EA%B2%BD%EB%82%A8%20%EC%82%AC%EC%B2%9C%EC%8B%9C%20%EB%AC%B8%EC%84%A04%EA%B8%B8%2021"
            target="_blank"
            rel="noopener noreferrer"
            class="map-button google-button"
          >
            구글지도
          </a>

        </div>
      </div>
    </div>

    <!-- 5면 -->
    <img
      src="05.jpg"
      alt="2026 자유새 정기 연주회 초대장 5면"
      class="invitation-img"
    >

    <!-- 6면 -->
    <img
      src="06.jpg"
      alt="2026 자유새 정기 연주회 초대장 6면"
      class="invitation-img"
    >

  </div>

</body>
</html>
